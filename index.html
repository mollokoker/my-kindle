<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нашли Kindle Сергея</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 18px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f1ec;
  color: #292820;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.card {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 22px;
  padding: 34px 24px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}
.book { font-size: 48px; margin-bottom: 18px; }
h1 { font-size: 25px; margin: 0 0 16px; }
p { font-size: 16px; line-height: 1.6; color: #666; }
a {
  display: block;
  padding: 16px;
  margin-top: 14px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
}
.telegram { background: #279bd6; color: white; }
.email { background: #f0eee9; color: #292820; }
.footer { margin-top: 25px; font-size: 13px; color: #999; }
</style>
</head>
<body>
<div class="card">
  <div class="book">📖</div>
  <h1>Вы нашли мою книгу!</h1>
  <p>
    Здравствуйте! Меня зовут Сергей.<br>
    Если вы нашли мой Kindle, буду очень благодарен,
    если свяжетесь со мной.
  </p>
  <a class="telegram" href="https://t.me/Bakenbardo">
    Написать в Telegram
  </a>
  <a class="email" href="mailto:Mollokoker@me.com?subject=Найдена%20ваша%20книга">
    Написать на почту
  </a>
  <div class="footer">
    Спасибо, что помогаете вернуть книгу владельцу!
  </div>
</div>
</body>
</html>
